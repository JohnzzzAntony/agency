<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuooNex CMS</title><style>body{font:16px system-ui;margin:0;background:#f4f4f7;color:#17172b}main{max-width:980px;margin:40px auto;padding:0 20px}section{background:#fff;padding:24px;margin:18px 0;border-radius:12px;box-shadow:0 2px 12px #0001}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd0dc;border-radius:7px;font:inherit}textarea{min-height:100px}button{background:#4329e8;color:white;border:0;border-radius:7px;padding:12px 18px;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.status{margin-left:14px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><h1>DuooNex content manager</h1><p>Edit site copy, SEO metadata and image paths without touching frontend code.</p><form id="editor"><section><h2>Site settings</h2><div class="row"><div><label>Agency name</label><input name="site.name"></div><div><label>Tagline</label><input name="site.tagline"></div></div><div class="row"><div><label>Email</label><input name="site.email"></div><div><label>Phone</label><input name="site.phone"></div></div><label>Logo path or URL</label><input name="site.logo"></section><section><h2>Home page</h2><label>SEO title</label><input name="pages.home.title"><label>SEO description</label><textarea name="pages.home.description"></textarea><label>Hero heading</label><input name="pages.home.heroTitle"><label>Hero description</label><textarea name="pages.home.heroDescription"></textarea><label>Hero image path or URL</label><input name="pages.home.heroImage"></section><section><button>Save changes</button><span class="status" id="status"></span></section></form></main><script src="admin.js"></script></body></html>
